{% extends "base.html" %}
{% block title %}Login - Test Shop{% endblock %}

{% block content %}
<h1>Login</h1>
<form id="login-form" data-testid="login-form" novalidate>
  <label>Email
    <input type="email" id="email" name="email" data-testid="login-email">
  </label>
  <label>Password
    <input type="password" id="password" name="password" data-testid="login-password">
  </label>
  <br><br>
  <button type="submit" data-testid="login-submit">Log in</button>
  <div id="login-error" class="error" data-testid="login-error" role="alert"></div>
</form>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("login-error");
    errorBox.textContent = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      errorBox.textContent = "Email and password are required";
      return;
    }

    const res = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({ email, password }),
    });

    if (res.ok) {
      localStorage.setItem("token", res.data.token);
      localStorage.setItem("userName", res.data.user.name);
      window.location.href = "/products";
    } else {
      errorBox.textContent = res.data && res.data.detail ? res.data.detail : "Login failed";
    }
  });
</script>
{% endblock %}
