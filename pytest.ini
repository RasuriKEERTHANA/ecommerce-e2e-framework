[pytest]
testpaths = tests
base_url = http://127.0.0.1:8001
addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --screenshot=only-on-failure
markers =
    smoke: quick checks that run on every pull request
    regression: full suite, run on a schedule
    api: API tests that call the backend directly (no browser)
    db: tests that check saved data with SQL
    hybrid: tests that check one flow through UI, API and SQL